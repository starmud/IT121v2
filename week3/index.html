<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student grades</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>

    <h2>Student Grades</h2>

    <div id="student-output"></div>

    <div id="results-output"></div>

    <div id="grader-output"></div>

<script>
    const grades = "jim|25, sue|32, mary|34, ann|22, ted|28, frank|15, lisa|19, mike|30, ahn|26, vishaya|27";

    // split students into an array 
    const studentEntries = grades.split(", ");
    const studentOutput = document.getElementById("student-output");
    studentEntries.forEach(entry => {
        const [name, score] = entry.split('|');
        studentOutput.innerHTML += `<p>${name} scored ${score}</p>`;
    }
    );
    
    // total number of students, lowest, highest and average scores
    const totalStudents = studentEntries.length;
    const lowestScore = Math.min(...studentEntries.map(entry => parseInt(entry.split('|')[1])));
    const highestScore = Math.max(...studentEntries.map(entry => parseInt(entry.split('|')[1])));
    const averageScore = studentEntries.reduce((sum, entry) => sum + parseInt(entry.split('|')[1]), 0) / totalStudents; 
    
    // display the results
    const resultsOutput = document.getElementById("results-output");
    resultsOutput.innerHTML = `<p>Total students: ${totalStudents}</p>
                               <p>Lowest score: ${lowestScore}</p>
                               <p>Highest score: ${highestScore}</p>
                               <p>Average score: ${averageScore}</p>
                             `;
    
</script>

</body>
</html>
