<!DOCTYPE html>
<html>
  <head>
<script src="https://code.jquery.com/jquery-3.6.3.min.js"></script>
<link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>

<h1>Functions & validation</h1>

<form id="form1" action="#" onsubmit="return validateForm(this);">
  First name: <input type="text" name="firstname"><br><br>
  Last name: <input type="text" name="lastname"><br><br>
  Password: <input type="text" name="password"><br><br>

  <button>Check</button><br>
</form>
<hr>
  <div id="message"></div>

<script>

  const validatePassword = (password) => {
    const hasUpperCase = /[A-Z]/.test(password);
    const hasLowerCase = /[a-z]/.test(password);
    const hasMinLength = password.length >= 8;
    
    return hasUpperCase && hasLowerCase && hasMinLength;
  }

  const validateForm = (myForm) => {
    let firstname = myForm.firstname.value.trim();
    let lastname = myForm.lastname.value.trim();
    let password = myForm.password.value;

    if (!firstname) {
      $("#message").html("First name must be filled out");
      return false;
    }

    if (!lastname) {
      $("#message").html("Last name must be filled out");
      return false;
    }
    
    if (!validatePassword(password)) {
      $("#message").html("Password must be at least 8 characters long, as well as contain both uppercase & lowercase letters");
      return false;
    }

    $("#message").html("Thank you for registering");
    return false;
  }

</script>

</body>
</html>
